name: Publish to Anypoint Exchange

# Publishes the custom plugin as an Exchange asset so Mule apps can resolve it.
# Runs on a version tag (e.g. v1.0.0) or manually.
#
# Required:
#   Secrets:  EXCHANGE_CLIENT_ID, EXCHANGE_CLIENT_SECRET  (Anypoint connected app, Exchange write)
#   Variables: ANYPOINT_ORG_ID                            (org/business-group GUID = published groupId)
#
# The project groupId is already the Anypoint org GUID, so no coordinate rewriting is needed —
# the build publishes under exactly the coordinates consumers reference.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Write Maven settings for Anypoint Exchange
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>$EXCHANGE_CLIENT_ID~?~$EXCHANGE_CLIENT_SECRET</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          EXCHANGE_CLIENT_ID: ${{ secrets.EXCHANGE_CLIENT_ID }}
          EXCHANGE_CLIENT_SECRET: ${{ secrets.EXCHANGE_CLIENT_SECRET }}

      # Extract release version from tag (v1.0.0 -> 1.0.0).
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            VERSION="${{ github.ref }}"
            VERSION=${VERSION#refs/tags/v}
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            VERSION=${VERSION%-SNAPSHOT}
          fi
          echo "release_version=${VERSION}" >> $GITHUB_OUTPUT

      # Set the release version (remove -SNAPSHOT), build, test & deploy to Exchange.
      # Exchange only accepts immutable release versions, not SNAPSHOTs.
      - name: Build, test & deploy to Exchange
        run: >-
          mvn -B -Pexchange-release clean
          org.codehaus.mojo:versions-maven-plugin:2.16.1:set
          -DnewVersion=${{ steps.version.outputs.release_version }}
          -DgenerateBackupPoms=false
          deploy
          -Danypoint.orgId=${ANYPOINT_ORG_ID}
