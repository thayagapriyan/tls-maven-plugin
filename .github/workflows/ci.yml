name: CI

# Tests the custom Maven plugin end to end WITHOUT any real AWS account:
#   1. unit-tests          - mocked S3 client / fake resolver
#   2. invoker-tests-local - skip-flag + local-fake-s3 ITs (no network egress to AWS)
#   3. e2e-localstack      - real S3 protocol via LocalStack: seed a keystore, run the
#                            plugin, assert it downloads and writes the file.
#
# Real-AWS / OIDC end-to-end lives in the consuming Mule app repo, not here.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '11'

jobs:
  # ─── Unit tests (no AWS, no network) ─────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Unit tests
        run: mvn -B --no-transfer-progress clean test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/

  # ─── Local invoker ITs (skip-flag, local-fake-s3) ────────────────────────────
  invoker-tests-local:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # No aws.it.bucket -> aws-download IT is skipped; only the AWS-free ITs run.
      - name: Run local integration tests
        run: mvn -B --no-transfer-progress clean verify
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

  # ─── End-to-end against LocalStack S3 (no real AWS) ──────────────────────────
  e2e-localstack:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # LocalStack accepts any creds; the plugin reads them via the SDK default chain.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # The plugin's S3 client (SDK v2) has no endpointOverride, but SDK v2 honors these
      # env vars. Use LocalStack's virtual-host-style domain so bucket addressing resolves
      # (<bucket>.s3.localhost.localstack.cloud -> 127.0.0.1).
      AWS_ENDPOINT_URL_S3: http://s3.localhost.localstack.cloud:4566
      AWS_ENDPOINT_URL: http://s3.localhost.localstack.cloud:4566
      IT_BUCKET: mule-tls-bucket
      IT_KEY: mule-app/dev/keystore.jks
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Throwaway keystore generated in CI — no cert material in Git.
      - name: Generate a demo keystore
        run: |
          keytool -genkeypair -alias mule-tls -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=localhost, OU=Demo, O=Priyan, C=NA" \
            -keystore keystore.jks -storetype JKS \
            -storepass changeit -keypass changeit

      - name: Seed the keystore into LocalStack S3
        run: |
          aws --endpoint-url http://localhost:4566 s3 mb "s3://$IT_BUCKET"
          aws --endpoint-url http://localhost:4566 s3 cp keystore.jks "s3://$IT_BUCKET/$IT_KEY"

      # Setting aws.it.bucket activates the aws-it profile, which runs the aws-download
      # IT. With AWS_ENDPOINT_URL_S3 pointed at LocalStack, the plugin downloads from it.
      - name: Run the download IT against LocalStack
        run: >-
          mvn -B --no-transfer-progress clean verify
          -Daws.it.bucket=$IT_BUCKET
          -Daws.it.key=$IT_KEY
          -Daws.it.region=us-east-1

      - name: Upload invoker reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-localstack-reports
          path: target/invoker-reports/
